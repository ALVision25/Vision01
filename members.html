<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members — The Antwerp Inn 1845</title>
    <link rel="stylesheet" href="style.css?v=devtest129" />
    <style>
        .members-card {
            max-width: 500px;
            margin: 3em auto;
            background: #1a120c;
            border: 1px solid #2a1e14;
            border-radius: 12px;
            padding: 2.5em 2em;
            text-align: center;
        }

        /* Login form */
        .auth-form input {
            width: 100%;
            padding: 0.6em;
            margin-bottom: 0.8em;
            background: #0a0705;
            border: 1px solid #3a2e1e;
            color: #e7d8b1;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.95rem;
        }
        .auth-form input::placeholder { color: #555; }
        .auth-error {
            color: #e74c3c;
            font-size: 0.85em;
            margin-bottom: 0.8em;
            min-height: 1.2em;
        }
        .btn-signin {
            width: 100%;
            background: #e7d8b1;
            color: #0a0705;
            font-family: 'OldEnglishFive', serif;
            padding: 0.7em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 0.8em;
            transition: background 0.2s;
        }
        .btn-signin:hover { background: #fff; }
        .btn-google {
            width: 100%;
            background: #221810;
            color: #e7d8b1;
            font-family: 'OldEnglishFive', serif;
            padding: 0.7em;
            border: 1px solid #3a2a1a;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .btn-google:hover { background: #2e2010; }
        .divider {
            color: #444;
            font-size: 0.8rem;
            margin: 0.8em 0;
        }

        /* Logged-in view */
        .member-content { display: none; }
        .member-welcome {
            color: #e7d8b1;
            font-family: 'OldEnglishFive', serif;
            font-size: 1.2rem;
            margin-bottom: 0.4em;
        }
        .member-email {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 1.5em;
        }
        .member-placeholder {
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 2em;
            font-style: italic;
        }
        .btn-signout {
            background: none;
            border: 1px solid #3a2a1a;
            color: #888;
            border-radius: 4px;
            padding: 0.4em 1.2em;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-signout:hover { color: #e7d8b1; border-color: #554433; }
        .btn-admin {
            display: inline-block;
            background: #e7d8b1;
            color: #0a0705;
            font-family: 'OldEnglishFive', serif;
            font-size: 1rem;
            padding: 0.7em 2em;
            border-radius: 6px;
            text-decoration: none;
            margin-bottom: 1.2em;
            transition: background 0.2s;
        }
        .btn-admin:hover { background: #fff; }
    </style>
</head>
<body class="subpage">

    <header class="site-header-unwrapped">
        <button class="menu-toggle" aria-label="Menu" id="menu-toggle">&#9776;</button>
        <h1 class="site-title-unwrapped">The Antwerp Inn 1845</h1>
    </header>

    <div class="subpage-subtitle-wrap">
        <h2 class="subpage-subtitle">Members</h2>
    </div>

    <nav class="side-menu" id="side-menu" aria-hidden="true">
        <button class="menu-close" id="menu-close" aria-label="Close">&#10005;</button>
        <ul>
            <li><a href="index.html">The Antwerp Inn</a></li>
            <li><a href="fort-drum.html">Fort Drum</a></li>
            <li><a href="antwerp-village.html">Antwerp Village</a></li>
            <li><a href="mcallister-house.html">McAllister House</a></li>
            <li><a href="north-country.html">North Country</a></li>
            <li><a href="members.html">Members</a></li>
        </ul>
    </nav>
    <div class="menu-overlay" id="menu-overlay"></div>

    <main class="subpage-main">
        <div class="members-card">

            <!-- Login form (shown when logged out) -->
            <div id="login-view">
                <h3 style="font-family:'OldEnglishFive',serif;color:#e7d8b1;font-weight:normal;margin:0 0 1.2em;">Member Login</h3>
                <div class="auth-form">
                    <input id="mem-email" type="email" placeholder="Email" />
                    <input id="mem-password" type="password" placeholder="Password" />
                    <div id="auth-error" class="auth-error"></div>
                    <button id="btn-email-signin" class="btn-signin">Sign In</button>
                    <div class="divider">&#8212; or &#8212;</div>
                    <button id="btn-google-signin" class="btn-google">Sign in with Google</button>
                </div>
            </div>

            <!-- Member content (shown when logged in) -->
            <div id="member-view" class="member-content">
                <p class="member-welcome">Welcome back</p>
                <p class="member-email" id="member-email-display"></p>
                <!-- Admin panel link — only visible to admin account -->
                <div id="admin-panel-link" style="display:none; margin-bottom:1.5em;">
                    <a href="admin.html" class="btn-admin">&#9881; Admin Panel</a>
                </div>
                <p class="member-placeholder">Membership Section Live &mdash; Summer 2026</p>
                <button id="btn-signout" class="btn-signout">Sign Out</button>
            </div>

        </div>
    </main>

    <script>
        const toggle  = document.getElementById('menu-toggle');
        const menu    = document.getElementById('side-menu');
        const overlay = document.getElementById('menu-overlay');
        const close   = document.getElementById('menu-close');
        function openMenu()  { menu.classList.add('open'); overlay.classList.add('open'); }
        function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
        toggle.addEventListener('click', openMenu);
        close.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);
    </script>

    <script src="firebase-config.js"></script>
    <script type="module">
        import { initializeApp }     from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut }
                                     from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        // Auth state observer
        onAuthStateChanged(auth, async user => {
            if (user) {
                document.getElementById('login-view').style.display  = 'none';
                document.getElementById('member-view').style.display = 'block';
                document.getElementById('member-email-display').textContent = user.email || user.displayName || '';
                // Bootstrap: register as admin if bootstrap doc exists and no admin doc yet
                try {
                    let adminSnap = await getDoc(doc(db, 'admins', user.uid));
                    if (!adminSnap.exists()) {
                        const bootstrapSnap = await getDoc(doc(db, 'admins', 'bootstrap'));
                        if (bootstrapSnap.exists()) {
                            await setDoc(doc(db, 'admins', user.uid), { registeredAt: new Date().toISOString() });
                            adminSnap = await getDoc(doc(db, 'admins', user.uid));
                        }
                    }
                    document.getElementById('admin-panel-link').style.display = adminSnap.exists() ? 'block' : 'none';
                } catch(e) {
                    document.getElementById('admin-panel-link').style.display = 'none';
                }
            } else {
                document.getElementById('login-view').style.display  = 'block';
                document.getElementById('member-view').style.display = 'none';
                document.getElementById('admin-panel-link').style.display = 'none';
            }
        });

        // Email/password sign-in
        document.getElementById('btn-email-signin').addEventListener('click', async () => {
            const email = document.getElementById('mem-email').value.trim();
            const pw    = document.getElementById('mem-password').value;
            document.getElementById('auth-error').textContent = '';
            try {
                await signInWithEmailAndPassword(auth, email, pw);
            } catch(e) {
                document.getElementById('auth-error').textContent = 'Invalid email or password.';
            }
        });

        document.getElementById('mem-password').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('btn-email-signin').click();
        });

        // Google sign-in
        document.getElementById('btn-google-signin').addEventListener('click', async () => {
            document.getElementById('auth-error').textContent = '';
            try {
                await signInWithPopup(auth, new GoogleAuthProvider());
            } catch(e) {
                if (e.code !== 'auth/popup-closed-by-user') {
                    document.getElementById('auth-error').textContent = 'Google sign-in failed. Please try again.';
                }
            }
        });

        // Sign out
        document.getElementById('btn-signout').addEventListener('click', () => signOut(auth));
    </script>

</body>
</html>
