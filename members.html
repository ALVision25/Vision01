<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Members — The Antwerp Inn 1845</title>
    <link rel="stylesheet" href="style.css?v=devtest126" />
    <style>
        .members-card {
            max-width: 500px;
            margin: 3em auto;
            background: #1a120c;
            border: 1px solid #2a1e14;
            border-radius: 12px;
            padding: 2.5em 2em;
            text-align: center;
        }
        .members-card p {
            color: #aaa;
            line-height: 1.7;
            margin-bottom: 2em;
        }
        .login-btn {
            display: inline-block;
            background: #e7d8b1;
            color: #0a0705;
            font-family: 'OldEnglishFive', serif;
            font-size: 1.1rem;
            padding: 0.7em 2.2em;
            border-radius: 6px;
            text-decoration: none;
            letter-spacing: 0.03em;
            transition: background 0.2s;
        }
        .login-btn:hover {
            background: #fff;
        }
    </style>
</head>
<body class="subpage">

    <header class="site-header-unwrapped">
        <button class="menu-toggle" aria-label="Menu" id="menu-toggle">&#9776;</button>
        <h1 class="site-title-unwrapped">The Antwerp Inn 1845</h1>
    </header>

    <div class="subpage-subtitle-wrap">
        <h2 class="subpage-subtitle">Members</h2>
    </div>

    <nav class="side-menu" id="side-menu" aria-hidden="true">
        <button class="menu-close" id="menu-close" aria-label="Close">&#10005;</button>
        <ul>
            <li><a href="index.html">The Antwerp Inn</a></li>
            <li><a href="fort-drum.html">Fort Drum</a></li>
            <li><a href="antwerp-village.html">Antwerp Village</a></li>
            <li><a href="mcallister-house.html">McAllister House</a></li>
            <li><a href="north-country.html">North Country</a></li>
            <li><a href="members.html">Members</a></li>
        </ul>
    </nav>
    <div class="menu-overlay" id="menu-overlay"></div>

    <main class="subpage-main">
        <div class="members-card">
            <p>This area is for site administrators and members. More features coming soon.</p>
            <a href="admin.html" class="login-btn">Admin Login</a>
        </div>
    </main>

    <script>
        const toggle  = document.getElementById('menu-toggle');
        const menu    = document.getElementById('side-menu');
        const overlay = document.getElementById('menu-overlay');
        const close   = document.getElementById('menu-close');
        function openMenu()  { menu.classList.add('open'); overlay.classList.add('open'); }
        function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }
        toggle.addEventListener('click', openMenu);
        close.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);
    </script>

</body>
</html>
