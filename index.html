<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Antwerp Inn 1845</title>
    <link rel="stylesheet" href="style.css?v=devtest127" />
    <style>
        body.home {
            height: 100vh;
            overflow: hidden;
        }

        /* Full-screen background images — both start invisible, JS fades first one in */
        #slide-front, #slide-back {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            opacity: 0;
            transition: opacity 2.25s ease-in-out;
            will-change: opacity;
        }

        /* Gradient so the title stays readable */
        .home-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.60) 0%,
                rgba(0,0,0,0.20) 40%,
                rgba(0,0,0,0.00) 75%
            );
            z-index: 1;
            pointer-events: none;
        }

        /* Header floats over the image */
        body.home .site-header-unwrapped {
            position: relative;
            z-index: 10;
            background: transparent;
        }

        /* Larger, shadowed title for the hero layout */
        body.home .site-title-unwrapped {
            font-size: clamp(2rem, 9vw, 5.5rem);
            text-shadow:
                1px 2px 12px rgba(0,0,0,0.95),
                0 0 40px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body class="home">

    <!-- Full-screen background slideshow images — src set by JS after config loads -->
    <img id="slide-front" alt="" />
    <img id="slide-back" alt="" />
    <div class="home-overlay"></div>

    <header class="site-header-unwrapped">
        <button class="menu-toggle" aria-label="Menu" id="menu-toggle">&#9776;</button>
        <h1 class="site-title-unwrapped">The Antwerp5 Inn 1845</h1>
    </header>

    <nav class="side-menu" id="side-menu" aria-hidden="true">
        <button class="menu-close" id="menu-close" aria-label="Close">&#10005;</button>
        <ul>
            <li><a href="index.html">The Antwerp Inn</a></li>
            <li><a href="fort-drum.html">Fort Drum</a></li>
            <li><a href="antwerp-village.html">Antwerp Village</a></li>
            <li><a href="mcallister-house.html">McAllister House</a></li>
            <li><a href="north-country.html">North Country</a></li>
            <li><a href="members.html">Members</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="timeline.html">Timeline</a></li>
        </ul>
    </nav>
    <div class="menu-overlay" id="menu-overlay"></div>

    <script src="firebase-config.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';

        const app = initializeApp(firebaseConfig);
        const db  = getFirestore(app);

        const DEFAULTS = [
            'slide1.jpg','slide2.jpg','slide3.jpg','slide4.jpg',
            'slide5.jpg','slide6.jpg','slide7.jpg','slide8.jpg',
            'slide9.jpg','slide10.jpg','slide11.jpg','slide12.jpg'
        ];

        async function loadConfig() {
            const defaults = { active: [...DEFAULTS], uploaded: [], custom: [], displayTime: 5000, fadeTime: 2250 };
            try {
                const snap = await getDoc(doc(db, 'slideshow', 'config'));
                if (snap.exists()) {
                    const cfg = { ...defaults, ...snap.data() };
                    localStorage.setItem('slideshowConfig', JSON.stringify(cfg));
                    return cfg;
                }
            } catch(e) {}
            try {
                const cached = JSON.parse(localStorage.getItem('slideshowConfig'));
                if (cached) return { ...defaults, ...cached };
            } catch(e) {}
            return defaults;
        }

        const cfg = await loadConfig();

        const hidden      = Array.isArray(cfg.hidden) ? cfg.hidden : [];
        const slides      = ((cfg.active && cfg.active.length) ? cfg.active : DEFAULTS).filter(s => !hidden.includes(s));
        const displayTime = cfg.displayTime || 5000;
        const fadeTime    = cfg.fadeTime    || 2250;

        // ── Persistence: resume from last shown image ──────────
        function getStartIndex(slides) {
            try {
                const saved     = JSON.parse(localStorage.getItem('slideshowState'));
                if (!saved) return 0;
                const ageMs     = Date.now() - (saved.savedAt || 0);
                const sevenDays = 7 * 24 * 60 * 60 * 1000;
                if (ageMs >= sevenDays) return Math.floor(Math.random() * slides.length);
                const idx = slides.indexOf(saved.currentUrl);
                return idx >= 0 ? idx : 0;
            } catch(e) { return 0; }
        }

        function saveState(url) {
            try {
                localStorage.setItem('slideshowState', JSON.stringify({
                    currentUrl: url,
                    savedAt: Date.now()
                }));
            } catch(e) {}
        }

        let current   = getStartIndex(slides);
        let animating = false;
        const front = document.getElementById('slide-front');
        const back  = document.getElementById('slide-back');

        // Apply configured fade duration
        const fadeSec = (fadeTime / 1000).toFixed(3);
        front.style.transition = 'opacity ' + fadeSec + 's ease-in-out';
        back.style.transition  = 'opacity ' + fadeSec + 's ease-in-out';

        // Load from saved position then fade in — no flash of stale image
        if (slides.length > 0) {
            front.onload = () => {
                front.onload = null;
                front.style.opacity = '1';
            };
            front.onerror = () => { front.onerror = null; front.style.opacity = '1'; };
            front.src = slides[current];
        }

        // Preload all other images so crossfade never waits on network
        slides.forEach((s, i) => { if (i !== current) { const img = new Image(); img.src = s; } });

        // ── Transition engine ───────────────────────────────────
        // Preload next image and display timer run in parallel.
        // Crossfade only starts when BOTH are ready — so display time
        // is always respected and images never pop in half-loaded.
        let timer = null;

        function scheduleNext() {
            if (slides.length < 2) return;
            clearTimeout(timer);

            const next    = (current + 1) % slides.length;
            const nextSrc = slides[next];
            let preloadReady = false;
            let timerReady   = false;

            function tryFade() {
                if (!preloadReady || !timerReady || animating) return;
                animating = true;
                back.src = nextSrc;
                requestAnimationFrame(() => {
                    front.style.opacity = '0';
                    back.style.opacity  = '1';

                    setTimeout(() => {
                        front.style.transition = 'none';
                        front.src              = nextSrc;
                        front.style.opacity    = '1';
                        back.style.transition  = 'none';
                        back.style.opacity     = '0';

                        requestAnimationFrame(() => requestAnimationFrame(() => {
                            front.style.transition = 'opacity ' + fadeSec + 's ease-in-out';
                            back.style.transition  = 'opacity ' + fadeSec + 's ease-in-out';
                            current   = next;
                            animating = false;
                            saveState(slides[current]);
                            scheduleNext();   // chain the next cycle
                        }));
                    }, fadeTime + 100);
                });
            }

            // Start preload and display timer simultaneously
            const preloader = new Image();
            preloader.onload = preloader.onerror = () => { preloadReady = true; tryFade(); };
            preloader.src = nextSrc;

            timer = setTimeout(() => { timerReady = true; tryFade(); }, displayTime);
        }

        // ── Pause when tab is hidden, resume when visible ───────
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearTimeout(timer);
                timer     = null;
                animating = false;
            } else {
                if (!animating) scheduleNext();
            }
        });

        scheduleNext();

        // Hamburger menu
        const toggle  = document.getElementById('menu-toggle');
        const menu    = document.getElementById('side-menu');
        const overlay = document.getElementById('menu-overlay');
        const close   = document.getElementById('menu-close');

        function openMenu()  { menu.classList.add('open'); overlay.classList.add('open'); }
        function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }

        toggle.addEventListener('click', openMenu);
        close.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);
    </script>

</body>
</html>
