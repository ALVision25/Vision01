<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Antwerp Inn 1845</title>
    <link rel="stylesheet" href="style.css?v=devtest124" />
    <style>
        .slideshow {
            text-align: center;
            margin: 2em auto;
            padding: 0 1em;
        }
        #slideshow-image {
            width: 65%;
            height: auto;
            display: inline-block;
            border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(231, 216, 177, 0.15);
            opacity: 1;
            transition: opacity 1.2s ease-in-out;
        }
        #slideshow-image.fade {
            opacity: 0;
        }
    </style>
</head>
<body class="home">

    <header class="site-header-unwrapped">
        <h1 class="site-title-unwrapped">The Antwerp Inn 1845</h1>
        <button class="menu-toggle" aria-label="Menu">&#9776;</button>
    </header>

    <main>
        <div class="slideshow">
            <img src="slide1.jpg" alt="Slideshow Image" id="slideshow-image" />
        </div>
    </main>

    <script>
        const slides = [
            'slide1.jpg','slide2.jpg','slide3.jpg','slide4.jpg',
            'slide5.jpg','slide6.jpg','slide7.jpg','slide8.jpg',
            'slide9.jpg','slide10.jpg','slide11.jpg','slide12.jpg'
        ];
        let current = 0;
        const img = document.getElementById('slideshow-image');

        function nextSlide() {
            img.classList.add('fade');
            setTimeout(() => {
                current = (current + 1) % slides.length;
                img.src = slides[current];
                img.classList.remove('fade');
            }, 1200);
        }

        // Pre-load all images for smooth transitions
        slides.forEach(s => { const i = new Image(); i.src = s; });

        setInterval(nextSlide, 5000);
    </script>

</body>
</html>
