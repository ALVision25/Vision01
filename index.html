<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Antwerp Inn 1845</title>
    <link rel="stylesheet" href="style.css?v=devtest124" />
    <style>
        .slideshow {
            text-align: center;
            margin: 1.36em auto;
            padding: 0 1em;
        }
        .slide-container {
            position: relative;
            width: 65%;
            display: inline-block;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: none;
            line-height: 0;
        }
        .slide-img {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 2.25s ease-in-out;
        }
        #slide-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
        }
    </style>
</head>
<body class="home">

    <header class="site-header-unwrapped">
        <h1 class="site-title-unwrapped">The Antwerp Inn 1845</h1>
        <button class="menu-toggle" aria-label="Menu" id="menu-toggle">&#9776;</button>
    </header>

    <nav class="side-menu" id="side-menu" aria-hidden="true">
        <button class="menu-close" id="menu-close" aria-label="Close">&#10005;</button>
        <ul>
            <li><a href="index.html">The Antwerp Inn</a></li>
            <li><a href="fort-drum.html">Fort Drum</a></li>
            <li><a href="antwerp-village.html">Antwerp Village</a></li>
            <li><a href="mcallister-house.html">McAllister House</a></li>
            <li><a href="north-country.html">North Country</a></li>
            <li><a href="members.html">Members</a></li>
        </ul>
    </nav>
    <div class="menu-overlay" id="menu-overlay"></div>

    <main>
        <div class="slideshow">
            <div class="slide-container">
                <img class="slide-img" id="slide-front" src="slide1.jpg" alt="Slideshow" />
                <img class="slide-img" id="slide-back" src="slide2.jpg" alt="Slideshow" />
            </div>
        </div>
    </main>

    <script>
        const _defaults = [
            'slide1.jpg','slide2.jpg','slide3.jpg','slide4.jpg',
            'slide5.jpg','slide6.jpg','slide7.jpg','slide8.jpg',
            'slide9.jpg','slide10.jpg','slide11.jpg','slide12.jpg'
        ];
        const _stored = localStorage.getItem('slideshowConfig');
        const slides = (_stored && JSON.parse(_stored).active.length)
            ? JSON.parse(_stored).active
            : _defaults;
        let current = 0;
        let animating = false;
        const front = document.getElementById('slide-front');
        const back  = document.getElementById('slide-back');

        // Preload all images up front so crossfade never waits on network
        slides.forEach(s => { const i = new Image(); i.src = s; });

        function nextSlide() {
            if (animating) return;
            animating = true;
            const next = (current + 1) % slides.length;

            // Load next image into back layer, then crossfade on next paint
            back.src = slides[next];
            requestAnimationFrame(() => {
                // True crossfade: both layers transition simultaneously
                front.style.opacity = '0';
                back.style.opacity  = '1';

                setTimeout(() => {
                    // Snap front to the new image invisibly, then restore
                    front.style.transition = 'none';
                    front.src = slides[next];
                    front.style.opacity = '1';
                    back.style.transition = 'none';
                    back.style.opacity = '0';

                    requestAnimationFrame(() => requestAnimationFrame(() => {
                        front.style.transition = 'opacity 2.25s ease-in-out';
                        back.style.transition  = 'opacity 2.25s ease-in-out';
                    }));

                    current = next;
                    animating = false;
                }, 2350);
            });
        }

        setInterval(nextSlide, 5000);

        // Hamburger menu
        const toggle  = document.getElementById('menu-toggle');
        const menu    = document.getElementById('side-menu');
        const overlay = document.getElementById('menu-overlay');
        const close   = document.getElementById('menu-close');

        function openMenu()  { menu.classList.add('open'); overlay.classList.add('open'); }
        function closeMenu() { menu.classList.remove('open'); overlay.classList.remove('open'); }

        toggle.addEventListener('click', openMenu);
        close.addEventListener('click', closeMenu);
        overlay.addEventListener('click', closeMenu);
    </script>

</body>
</html>
